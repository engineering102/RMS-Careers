# CI/CD Phase 3 PROOF OF CONCEPT, one application. THIS WORKFLOW DOES NOT DEPLOY.
#
# Reusable workflow (workflow_call only: it cannot be triggered on its own). It is called once per app by
# artifact-poc.yml, so every app has its OWN `build` -> `verify` pair and its own job output. There is no matrix and
# therefore no shared output map: `needs.build.outputs.digest` can only ever be this app's digest.
#
#   build  : guarded `cf:build` -> package .open-next + deployment config -> upload ONE artifact, and publish
#            `digest=<app>:<sha256 of manifest.json>` as a JOB OUTPUT (a channel separate from the artifact)
#   verify : separate job, fresh checkout, NO build -> download -> check the digest hand-off (present, well formed,
#            labelled for THIS app, equal to the manifest) -> verify provenance -> extract (bound to the inventory) ->
#            prove every symlink resolves -> negative tests -> wrangler --dry-run (credential-free)
#
# Safety rules (enforced by scripts/ci/__tests__/artifact-poc-workflow.test.mjs):
#   * no GitHub Environment, no `secrets.*`, no Cloudflare/Wrangler credential, no production DB URL
#   * `contents: read` only
#   * no `wrangler deploy` without --dry-run, no `opennextjs-cloudflare deploy|upload`
#   * every third-party action is pinned to a full commit SHA (resolved from the official repositories' tags)
#
# EVIDENCE STATUS: this workflow has NOT yet been run on GitHub Actions. What has been exercised is the same
# scripts/ci/artifact.mjs flow on Linux under WSL, plus unit tests. Real artifact upload/download, the job-output
# hand-off and the digest check of download-artifact are unverified until a first run.
name: Artifact PoC (per app)

on:
  workflow_call:
    inputs:
      app:
        description: Which application to build and verify (web, admin or student).
        type: string
        required: true

permissions:
  contents: read

env:
  POSTGRES_URL: ''
  DATABASE_URL: ''

jobs:
  build:
    name: build + package (${{ inputs.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.package.outputs.digest }}
    env:
      APP: ${{ inputs.app }}
    steps:
      # artifact.mjs rejects anything but web|admin|student; fail before spending a build on a bad input.
      - name: Validate app input
        run: |
          case "$APP" in web|admin|student) ;; *) echo "::error::unknown app '$APP'"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Existing guarded build: env-file guard (pre) -> opennextjs-cloudflare build -> embedded-env guard (post).
      - name: Build (guarded cf:build)
        run: pnpm --filter "@rms/$APP" run cf:build
      # Symlinks are archived as symlinks (never dereferenced). Fails closed on a dangling or out-of-repo link.
      # Writes `digest=<app>:<sha256 of manifest.json>` to $GITHUB_OUTPUT.
      - name: Package artifact
        id: package
        run: node scripts/ci/artifact.mjs package --app "$APP" --out "$RUNNER_TEMP/artifact/$APP"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-next-${{ inputs.app }}
          path: ${{ runner.temp }}/artifact/${{ inputs.app }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: true
          overwrite: true

  verify:
    name: verify artifact (${{ inputs.app }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This job must NOT rebuild: prove there is no build output before the artifact is extracted.
      - name: Assert no build output exists
        run: |
          set -euo pipefail
          for p in "apps/$APP/.open-next" "apps/$APP/.next"; do
            if [ -e "$p" ]; then echo "::error::$p exists before the artifact was extracted"; exit 1; fi
          done
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: open-next-${{ inputs.app }}
          path: ${{ runner.temp }}/artifact/${{ inputs.app }}
          digest-mismatch: error
      # The verifier fails closed if the hand-off is empty, malformed, labelled for another app, or does not match.
      - name: Verify integrity, provenance and symlinks, then extract
        env:
          EXPECT_MANIFEST_SHA256: ${{ needs.build.outputs.digest }}
        run: >-
          node scripts/ci/artifact.mjs verify --app "$APP" --dir "$RUNNER_TEMP/artifact/$APP"
          --expect-sha "$GITHUB_SHA" --expect-run-id "$GITHUB_RUN_ID"
          --expect-manifest-sha256 "$EXPECT_MANIFEST_SHA256"
      - name: Embedded-environment guard on the extracted artifact
        working-directory: apps/${{ inputs.app }}
        run: node ../../scripts/check-cloudflare-build-env.mjs post
      - name: Negative tests (modified artifact, forged or edited manifest, injected or unlisted file, missing symlink target)
        run: node scripts/ci/artifact.mjs negative-tests --app "$APP" --dir "$RUNNER_TEMP/artifact/$APP"
      # Refuses to run if any CLOUDFLARE_*/CF_*/WRANGLER_* variable is set; always passes --dry-run.
      - name: Dry run of the Worker bundle (wrangler --dry-run; no credentials, nothing is deployed)
        run: node scripts/ci/artifact.mjs dry-run --app "$APP" --out "$RUNNER_TEMP/dry-run/$APP"
